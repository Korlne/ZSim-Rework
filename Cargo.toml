[workspace]
members = [
    "zsim-core",
    "zsim-parquet",
    "zsim-pyo3",
    "zsim-cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Korlne/zsim"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1"
thiserror = "2"
arrow = "55"
parquet = "55"
pyo3 = { version = "0.24", features = ["extension-module"] }
