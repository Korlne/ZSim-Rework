[package]
name = "zsim-tauri"
version = "0.1.0"
description = "ZSim 2.0 Tauri desktop shell — simulation launcher and analysis viewer"
edition = "2021"

[lib]
name = "zsim_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zsim-core = { path = "../zsim-core" }

[dev-dependencies]
tempfile = "3"
